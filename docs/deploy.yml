# Автоматическая публикация сайта на GitHub Pages при каждом изменении в ветке main.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка
        run: npm run build
        env:
          # Если репозиторий называется <логин>.github.io, замените на: /
          VITE_BASE: /${{ github.event.repository.name }}/
          # Ключи Supabase берутся из Settings → Secrets and variables → Actions.
          # Если их нет, сайт соберётся в демо-режиме.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # GitHub Pages не знает про маршруты сайта (/theory, /practice…) — отдаём index.html и для них
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
